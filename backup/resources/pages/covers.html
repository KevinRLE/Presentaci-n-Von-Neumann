<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Covers</title>
  <link rel="stylesheet" href="../css/covers.css">
  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/nosotros.css">

</head>
<body>

  <!-- Fondo animado -->
  <div class="fondo-neon"></div>

  <button id="btn-regresar-modulos" class="btn-regresar">← Regresar a Módulos</button>

  <!-- Encabezado -->
  <header>
    <h1 class="neon-text">🎵 Nuestros VideoCovers 🎵</h1>
    <p class="subtitulo">Producciones Apoyados con Barak Audiovisual</p>
  </header>

  <!-- Contenedor de videos -->
  <main class="galeria">
    <div class="card-video">
      <video controls poster="../assets/No voy en tren poster.png">
        <source src="../assets/Videos/No voy en Tren - ELECTROCOVER.MP4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
      </video>
      <h3>No voy en Tren Voy en Avión</h3>
      <p>ElectroCover - No voy en Tren Voy en Avión - Charly García Remix Mariano Ballejos</p>
    </div>

    <div class="card-video">
      <video controls poster="../assets/Suavemente Foto prod 4.jpg">
        <source src="../assets/Videos/Tratame Suavemente - Soda Steroe - Waldo Dance Remix - Electro Cover.MP4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
      </video>
      <h3>Tratame Suavemente</h3>
      <p>ElectroCover - Tratame Suavemente - Soda Stereo Waldo Dance Remix</p>
    </div>


  <script src="../js/covers.js"></script>
  <script src="../js/nosotros.js"></script>
  
</body>
</html>
